<svg xmlns="http://www.w3.org/2000/svg" width="818" height="222" viewBox="222 0 818 222" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>How VirpilGrip works</title>
  <style>
    .card  { fill: #f6f8fa; stroke: #d0d7de; }
    .box   { fill: #ffffff; stroke: #d0d7de; }
    .hi    { fill: #ffffff; stroke: #00979d; }
    .ink   { fill: #1f2328; }
    .muted { fill: #57606a; }
    .acc   { fill: #0969da; }
    .accs  { stroke: #0969da; }
    .line  { stroke: #57606a; }
    .cell  { fill: #0969da; }
    .pill  { fill: #ddf4ff; }
    .pillt { fill: #0a3069; }
    .tealf { fill: #00979d; }
    .teals { stroke: #00979d; }
    .scr   { fill: #24292f; }
    @media (prefers-color-scheme: dark) {
      .card  { fill: #161b22; stroke: #30363d; }
      .box   { fill: #0d1117; stroke: #30363d; }
      .hi    { fill: #0d1117; stroke: #2bb3b8; }
      .ink   { fill: #e6edf3; }
      .muted { fill: #8d96a0; }
      .acc   { fill: #4493f8; }
      .accs  { stroke: #4493f8; }
      .line  { stroke: #8d96a0; }
      .cell  { fill: #4493f8; }
      .pill  { fill: #0c2d6b; }
      .pillt { fill: #cae8ff; }
      .tealf { fill: #2bb3b8; }
      .teals { stroke: #2bb3b8; }
      .scr   { fill: #8d96a0; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#8c959f"/>
    </marker>
    <marker id="b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#0969da"/>
    </marker>
  </defs>

  <rect class="card" x="223" y="1" width="816" height="220" rx="14" stroke-width="1.5"/>

  <!-- 1. Arduino -->
  <rect class="hi" x="238" y="52" width="210" height="146" rx="12" stroke-width="2"/>
  <path class="tealf" transform="translate(313,52) scale(2.5)" d="M18.087 6.146c-.3 0-.607.017-.907.069-2.532.367-4.23 2.239-5.18 3.674-.95-1.435-2.648-3.307-5.18-3.674a6.49 6.49 0 0 0-.907-.069C2.648 6.146 0 8.77 0 12s2.656 5.854 5.913 5.854c.3 0 .607-.017.916-.069 2.531-.376 4.23-2.247 5.18-3.683.949 1.436 2.647 3.307 5.18 3.683.299.043.607.069.915.069C21.344 17.854 24 15.23 24 12s-2.656-5.854-5.913-5.854zM6.53 15.734a3.837 3.837 0 0 1-.625.043c-2.148 0-3.889-1.7-3.889-3.777 0-2.085 1.749-3.777 3.898-3.777.208 0 .416.017.624.043 2.39.35 3.847 2.768 4.347 3.734-.508.974-1.974 3.384-4.355 3.734zm11.558.043c-.208 0-.416-.017-.624-.043-2.39-.35-3.856-2.768-4.347-3.734.491-.966 1.957-3.384 4.347-3.734.208-.026.416-.043.624-.043 2.149 0 3.89 1.7 3.89 3.777 0 2.085-1.75 3.777-3.89 3.777zm1.65-4.404v1.134h-1.205v1.182h-1.156v-1.182H16.17v-1.134h1.206V10.19h1.156v1.183h1.206zM4.246 12.498H7.82v-1.125H4.245v1.125z"/>
  <text class="ink" x="343" y="120" text-anchor="middle" font-size="17" font-weight="700">Arduino</text>
  <text class="muted" x="343" y="141" text-anchor="middle" font-size="14">+ VirpilGrip library</text>
  <rect class="pill" x="298" y="156" width="90" height="24" rx="12"/>
  <text class="pillt" x="343" y="173" text-anchor="middle" font-size="13" font-weight="600">SPI slave</text>

  <!-- 2. the Mini-DIN link -->
  <text class="muted" x="548" y="50" text-anchor="middle" font-size="12.5" font-weight="700" letter-spacing="1">MINI-DIN 5</text>
  <text class="muted" x="548" y="84" text-anchor="middle" font-size="13">SCK + SS: the base polls</text>
  <line class="line" x1="640" y1="98" x2="458" y2="98" stroke-width="2" marker-end="url(#a)"/>
  <g class="cell">
    <rect x="463" y="136" width="10" height="12" rx="2"/><rect x="475" y="136" width="10" height="12" rx="2"/>
    <rect x="487" y="136" width="10" height="12" rx="2"/><rect x="499" y="136" width="10" height="12" rx="2"/>
    <rect x="511" y="136" width="10" height="12" rx="2"/><rect x="523" y="136" width="10" height="12" rx="2"/>
    <rect x="535" y="136" width="10" height="12" rx="2"/><rect x="547" y="136" width="10" height="12" rx="2"/>
    <rect x="559" y="136" width="10" height="12" rx="2"/><rect x="571" y="136" width="10" height="12" rx="2"/>
    <rect x="583" y="136" width="10" height="12" rx="2"/><rect x="595" y="136" width="10" height="12" rx="2"/>
    <rect x="607" y="136" width="10" height="12" rx="2"/><rect x="619" y="136" width="10" height="12" rx="2"/>
  </g>
  <line x1="458" y1="158" x2="640" y2="158" stroke="#0969da" class="accs" stroke-width="2.5" marker-end="url(#b)"/>
  <text class="ink" x="548" y="180" text-anchor="middle" font-size="13" font-weight="600">MISO: 14-byte answer</text>
  <text class="muted" x="548" y="197" text-anchor="middle" font-size="12.5">state of every control, 0 = pressed</text>

  <!-- 3. the base -->
  <rect class="box" x="648" y="52" width="200" height="146" rx="12" stroke-width="1.5"/>
  <text class="ink" x="748" y="103" text-anchor="middle" font-size="16" font-weight="700">Virpil or</text>
  <text class="ink" x="748" y="124" text-anchor="middle" font-size="16" font-weight="700">Thrustmaster base</text>
  <text class="muted" x="748" y="144" text-anchor="middle" font-size="13">unmodified</text>
  <rect class="pill" x="700" y="156" width="96" height="24" rx="12"/>
  <text class="pillt" x="748" y="173" text-anchor="middle" font-size="13" font-weight="600">SPI master</text>

  <text class="muted" x="874" y="117" text-anchor="middle" font-size="12.5" font-weight="700">USB</text>
  <line class="line" x1="850" y1="125" x2="898" y2="125" stroke-width="2" marker-end="url(#a)"/>

  <!-- 4. PC -->
  <rect class="box" x="904" y="52" width="120" height="146" rx="12" stroke-width="1.5"/>
  <rect class="scr" x="928" y="74" width="72" height="48" rx="5"/>
  <path class="scr" d="M958,122 L954,136 H974 L970,122 Z"/>
  <rect class="scr" x="944" y="135" width="40" height="5" rx="2"/>
  <text class="ink" x="964" y="164" text-anchor="middle" font-size="15" font-weight="700">PC</text>
  <text class="muted" x="964" y="183" text-anchor="middle" font-size="12.5">regular joystick</text>
</svg>
