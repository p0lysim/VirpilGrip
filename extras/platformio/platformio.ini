; PlatformIO development project for the VirpilGrip library.
;
; The library sources (../../src) are linked with "symlink://": anything you
; change while developing here is changed directly in the library itself.
;
;   pio run                 -> build the default board (nano)
;   pio run -e micro        -> build for an Arduino Micro
;   pio run -t upload       -> flash
;   pio device monitor      -> serial monitor (115200 baud)

[platformio]
default_envs = nano
description = VirpilGrip development / test firmware

[env]
platform = atmelavr
framework = arduino
monitor_speed = 115200
lib_deps = symlink://../..

; Arduino Nano (ATmega328P). Most clones ship with the *old* bootloader.
; For a genuine Nano with the new bootloader use: board = nanoatmega328new
[env:nano]
board = nanoatmega328

[env:uno]
board = uno

; Arduino Micro (ATmega32U4) - SPI pins are NOT D10/D12/D13, see docs/WIRING.md
[env:micro]
board = micro
